<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossing the Parris Multiverse</title><style>
html,body{height:100%;margin:0;background:#03020a;color:#ede9fe;font-family:Georgia,serif}body{display:grid;place-items:center;overflow:hidden}.wrap{text-align:center;max-width:680px;padding:28px}.orb{width:220px;height:220px;margin:auto;border-radius:50%;border:2px solid #8b5cf6;box-shadow:0 0 40px #7c3aed99,inset 0 0 50px #6d28d966;animation:spin 3s linear infinite;background:radial-gradient(circle,#4c1d95,#100622 55%,#03020a 72%)}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:clamp(28px,6vw,52px);margin:26px 0 8px}.flavour{color:#c4b5fd;font-style:italic;font-size:18px;line-height:1.6}.dest{margin-top:14px;text-transform:uppercase;letter-spacing:.18em;color:#67e8f9;font:700 13px system-ui}.bar{height:3px;background:#1e1b4b;margin:22px auto 0;max-width:280px;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#67e8f9)}button{margin-top:18px;border:1px solid #ffffff33;background:#ffffff10;color:white;border-radius:999px;padding:9px 14px;cursor:pointer}
</style></head><body><div class="wrap"><div class="orb"></div><h1>Reality folds.</h1><div class="flavour" id="flavour">Finding the gate…</div><div class="dest" id="dest"></div><div class="bar"><div class="fill" id="fill"></div></div><button id="skip">cross now →</button></div><script>
(async()=>{const p=new URLSearchParams(location.search),from=p.get("from")||"",to=p.get("to")||"";let r={};try{r=await fetch("./portal-registry.json",{cache:"no-store"}).then(x=>x.json())}catch(e){console.error(e)}
let flavour="The air shimmers. You pass between worlds.";const route=r[from]?.portals?.find(x=>x.to===to);if(route?.flavour)flavour=route.flavour;
document.getElementById("flavour").textContent=flavour;document.getElementById("dest").textContent=r[to]?.label||to.replace(/-/g," ")||"Unknown destination";
const target=r[to]?.url||p.get("url");let done=false;function cross(){if(done||!target)return;done=true;const u=new URL(target,location.href);u.searchParams.set("portal","true");if(from)u.searchParams.set("from",from);location.href=u.toString()}
document.getElementById("skip").onclick=cross;const fill=document.getElementById("fill"),start=Date.now(),delay=3200;function tick(){const n=Math.min(100,(Date.now()-start)/delay*100);fill.style.width=n+"%";n<100?requestAnimationFrame(tick):cross()}requestAnimationFrame(tick)})();
</script></body></html>
